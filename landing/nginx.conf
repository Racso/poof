server {
    listen 80;

    location = /install {
        return 302 https://raw.githubusercontent.com/racso/poof/main/install.sh;
    }

    location = /agents.md {
        return 302 /AGENTS.md;
    }

    location = /AGENTS.md {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
