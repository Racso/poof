# [poof-auto-ci] AUTO-GENERATED BY Poof! — CHANGES MAY BE OVERRIDDEN. DISABLE CI ON Poof! TO USE A CUSTOM FILE.
name: Poof! deploy (static, landing)

on:
  push:
    branches: ["main"]
    paths:
      - "landing/**"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.POOF_DISABLE != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Poof!
        run: |
          tar -czf /tmp/site.tar.gz --exclude=.git -C landing .
          POOF_URL="https://p.rac.so"
          JWT=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$POOF_URL" | jq -r .value)
          curl -fsSL -X POST "$POOF_URL/projects/poof/deploy/static" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/site.tar.gz
